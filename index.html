<header><div class="identity"><span class="mark"></span><div><strong>Township Atlas</strong><small>PONG YANG KOK · LAMPANG</small></div></div><div class="metric"><small>คลังเมือง</small><b id="cash"></b></div><div class="metric"><small>ประชากร</small><b id="pop"></b></div><div class="metric"><small>ความสุข</small><b id="happy"></b></div></header>
<nav class="nav" id="nav"></nav><section class="dossier" id="panel" aria-live="polite"></section><section class="tray" id="tray"><div class="tabs" id="tabs"></div><div class="cards" id="cards"></div></section><div class="clock"><b id="date"></b><button id="play" aria-label="เดินเวลาหรือหยุด">▶</button><button id="next">เดือนถัดไป</button></div><div class="maptools"><button id="minus" aria-label="ซูมออก">−</button><button id="home" aria-label="กลับกลางเมือง">⌂</button><button id="plus" aria-label="ซูมเข้า">＋</button></div><output class="notice" id="notice" aria-live="polite"></output><script>const GROUPS={
  'แบ่งเขต':[['zoneR','เขตที่อยู่อาศัย',280],['zoneC','เขตพาณิชยกรรม',420],['zoneI','เขตอุตสาหกรรม',560]],
  'อุตสาหกรรม':[['mill','โรงสีข้าว',2400],['kiln','โรงงานเซรามิก',3200]],
  'ที่อยู่อาศัย':[['wood','บ้านไม้ยกพื้น',800,12],['modern','บ้านปูนโมเดิร์น',1400,20],['row','ตึกแถวคูหา',2400,34],['condo','คอนโด',5800,88],['court','บ้านล้อมลาน',1900,28]],
  'ค้าขาย':[['market','กาดชุมชน',1300],['shop','ร้านโชห่วย',850],['mall','ห้างสรรพสินค้า',6200],['cafe','ร้านกาแฟริมทาง',1150]],
  'เกษตร':[['cane','ไร่อ้อย',650],['cassava','ไร่มันสำปะหลัง',520],['soy','ไร่ถั่วเหลือง',440],['pineapple','ไร่สับปะรด',760],['orchard','สวนผลไม้',980],['veg','แปลงผัก',380],['livestock','ฟาร์มปศุสัตว์',1250]],
  'เหมือง':[['coal','เหมืองถ่านหิน',1950],['gold','เหมืองทองคำ',3400],['silver','เหมืองเงิน',2700],['copper','เหมืองทองแดง',2100]],
  'โครงสร้าง':[['road','ถนนลาดยาง',120],['poleWood','เสาไม้ · 3 ช่อง',250],['poleConcrete','เสาคอนกรีต · 5 ช่อง',480],['pylon','เสาแรงสูง · 8 ช่อง',1200],['plant','โรงไฟฟ้าถ่านหิน',3700]],
  'ชุมชน':[['park','สวนสาธารณะ',650],['school','โรงเรียน',1700],['clinic','สถานีอนามัย',1900],['temple','วัดล้านนา',2400],['fire','สถานีดับเพลิง',2100],['drain','สถานีสูบน้ำ',1750]]
};
const catalog=Object.fromEntries(Object.entries(GROUPS).flatMap(([group,rows])=>rows.map(([id,name,cost,capacity])=>[id,{id,name,cost,capacity,group}])));
const N=26, range={poleWood:3,poleConcrete:5,pylon:8,plant:3}, key=(i,j)=>i+','+j;
const roles=['นายกเทศมนตรีตำบล','ผู้บริหารระดับอำเภอ','ผู้บริหารระดับจังหวัด','สมาชิกสภาผู้แทนราษฎร','นายกรัฐมนตรี'];
// The western road tile is the town entrance: every road network is traced from it.
const ENTRANCE='2,14',BRIDGE_COST=420,LOAN=4000,LOAN_RATE=1.1,DEBT_PAYMENT=220;
const COMMUNITY={park:120,school:150,clinic:200,temple:300,fire:240,drain:200}; // residents served per building
const SHOP_WEIGHT={shop:1,market:1.5,mall:4};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function terrain(i,j){let d=j-(3.3+Math.sin(i*.28)*1.45+i*.12);return Math.abs(d)<1.12?'water':Math.abs(d)<1.7?'bank':'land'}
// Roads laid over the river become bridges, which cost more to build.
function buildCost(id,i,j){return id==='road'&&i!==undefined&&terrain(i,j)==='water'?BRIDGE_COST:catalog[id].cost}
function cellName(id,i,j){return id==='road'&&i!==undefined&&terrain(i,j)==='water'?'สะพาน':catalog[id].name}
function saleValue(id,i,j){return Math.floor(buildCost(id,i,j)/2)}
function sellTile(s,k,expected){
 if(s.opposition||k===ENTRANCE||!catalog[expected]||s.cells[k]!==expected)return false;
 const [i,j]=k.split(',').map(Number),value=saleValue(expected,i,j);
 delete s.cells[k];s.cash+=value;
 s.news='ขาย'+cellName(expected,i,j)+' • เงินคืน ฿'+value.toLocaleString('th-TH');return true;
}
function newCity(){
 let cells={},put=(i,j,id)=>cells[key(i,j)]=id;
 for(let i=2;i<24;i++)put(i,14,'road');
 for(let j=7;j<24;j++)put(13,j,'road');
 for(let i=6;i<=19;i++)put(i,19,'road');
 for(let j=11;j<20;j++)put(7,j,'road');
 // Poles at 11,12 and 16,17 bridge the gaps so the starting town is fully powered.
 [[8,13,'wood'],[9,13,'wood'],[10,13,'market'],[11,13,'shop'],[12,13,'row'],[14,13,'modern'],[15,13,'wood'],[16,13,'temple'],[8,15,'modern'],[9,15,'wood'],[11,15,'wood'],[12,15,'market'],[14,15,'row'],[15,15,'wood'],[16,15,'park'],[12,11,'school'],[14,11,'clinic'],[8,18,'soy'],[9,18,'cane'],[10,18,'veg'],[11,18,'pineapple'],[12,18,'orchard'],[14,18,'livestock'],[15,18,'cassava'],[16,18,'veg'],[20,13,'coal'],[21,13,'plant'],[18,13,'poleConcrete'],[14,12,'poleConcrete'],[11,12,'poleConcrete'],[10,15,'poleConcrete'],[12,17,'poleWood'],[16,17,'poleConcrete']].forEach(a=>put(...a));
 return {v:1,cells,cash:24000,tax:8,services:2,month:0,pop:108,approval:66,level:0,opposition:false,campaign:0,wins:0,trust:2,influence:0,actionMonth:-1,party:4000,news:'ชาวบ้านเปิดกาดเช้า เทศบาลพร้อมรับฟังความคิดเห็น',rival:55,hist:[],debt:0,loanMonth:-99,speed:0};
}
// Saved games are untrusted: keep only known structures on valid tiles and clamp every number.
function validSave(old){return !!old&&typeof old==='object'&&old.v===1&&!!old.cells&&typeof old.cells==='object'&&!Array.isArray(old.cells)}
function sanitizeCity(old){
 const base=newCity();
 if(!validSave(old))return base;
 const cells={};
 for(const [k,id] of Object.entries(old.cells)){
  const m=/^(-?\d+),(-?\d+)$/.exec(k);if(!m||typeof id!=='string'||!Object.hasOwn(catalog,id))continue;
  const i=+m[1],j=+m[2];if(i<0||j<0||i>=N||j>=N||(terrain(i,j)==='water'&&id!=='road'))continue;
  cells[key(i,j)]=id;
 }
 cells[ENTRANCE]='road';
 const num=(v,d,lo,hi)=>{if(v===null||v===undefined||v==='')return d;v=Number(v);return Number.isFinite(v)?clamp(v,lo,hi):d};
 const int=(v,d,lo,hi)=>Math.round(num(v,d,lo,hi));
 const month=int(old.month,0,0,1e6);
 return {...base,cells,
  cash:num(old.cash,base.cash,-1e9,1e9),tax:int(old.tax,8,2,22),services:int(old.services,2,0,5),month,
  pop:int(old.pop,base.pop,0,1e6),approval:num(old.approval,base.approval,0,100),level:int(old.level,0,0,roles.length-1),
  opposition:old.opposition===true,campaign:num(old.campaign,0,0,500),wins:int(old.wins,0,0,99),trust:num(old.trust,2,-20,14),
  influence:num(old.influence,0,0,500),actionMonth:int(old.actionMonth,-1,-1,1e6),party:num(old.party,4000,0,1e9),
  news:typeof old.news==='string'?old.news.slice(0,240):base.news,rival:num(old.rival,55,20,90),
  hist:Array.isArray(old.hist)?old.hist.map(Number).filter(Number.isFinite).map(v=>clamp(v,0,100)).slice(-6):[],
  debt:num(old.debt,0,0,1e7),loanMonth:int(old.loanMonth,-99,-99,month),speed:int(old.speed,0,0,2)};
}

const zonePlans={zoneR:['wood','court','condo'],zoneC:['shop','market','mall'],zoneI:['mill','kiln']};
const keySave='township-atlas-v2', el=id=>document.getElementById(id), fmt=n=>Math.round(n).toLocaleString('th-TH');
const cases=[
 {title:'ฝนหลากเข้าพื้นที่ลุ่ม',text:'ลดความเสียหายด้วยสถานีสูบน้ำ หรือใช้งบสำรองซ่อมทาง',a:'เสริมแนวป้องกัน',b:'ซ่อมเฉพาะจุด',service:'drain',cost:580},
 {title:'กาดเซรามิกลำปาง',text:'ผู้ผลิตท้องถิ่นขอใช้พื้นที่จัดกาด โรงงานเซรามิกช่วยดึงผู้ซื้อ',a:'จัดกาดเต็มวัน',b:'เปิดลานชุมชน',service:'kiln',cost:320},
 {title:'ฤดูไฟป่า',text:'จัดทีมเฝ้าระวังร่วมกับสถานีดับเพลิง หรือให้ชุมชนดูแลพื้นที่',a:'ส่งทีมเฝ้าระวัง',b:'ใช้ทีมอาสา',service:'fire',cost:460},
 {title:'งานโคมล้านนา',text:'วัดและร้านค้าขอร่วมจัดงานกลางคืน เลือกขนาดงานให้เหมาะกับคลัง',a:'เปิดงานทั้งย่าน',b:'จัดงานในชุมชน',service:'temple',cost:380}
];
function openCity(){
 let data;try{data=JSON.parse(localStorage.getItem(keySave)||'null');if(!data)data=JSON.parse(localStorage.getItem('pyk-city-1')||'null')}catch{}
 const c=sanitizeCity(data),fresh=data?.edition===2;
 return {v:1,edition:2,cells:c.cells,cash:c.cash,pop:c.pop,month:c.month,tax:c.tax,services:c.services,approval:c.approval,
 pending:fresh&&Number.isInteger(data.pending)&&cases[data.pending]?data.pending:null,news:fresh?c.news:'เลือกแปลงบนแผนที่เพื่อดูถนน ไฟฟ้า และการใช้ที่ดิน'};
}
const city=openCity();
function save(){try{localStorage.setItem(keySave,JSON.stringify(city))}catch{message('เบราว์เซอร์บันทึกความคืบหน้าไม่ได้')}}
function model(c){
 const entries=Object.entries(c.cells).map(([k,id])=>({k,id,p:k.split(',').map(Number)}));
 const around=([i,j])=>[[i+1,j],[i-1,j],[i,j+1],[i,j-1]];
 const roads=new Set(),queue=[ENTRANCE];
 for(let n=0;n<queue.length;n++){const k=queue[n];if(roads.has(k)||c.cells[k]!=='road')continue;roads.add(k);for(const p of around(k.split(',').map(Number)))queue.push(p.join(','))}
 const access=p=>around(p).some(q=>roads.has(q.join(','))), dist=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
 const nodes=entries.filter(e=>range[e.id]),fuel=entries.some(e=>e.id==='coal'&&access(e.p));
 const live=nodes.filter(e=>e.id==='plant'&&fuel&&access(e.p));
 for(let n=0;n<live.length;n++)for(const e of nodes)if(e.id!=='plant'&&!live.includes(e)&&dist(e.p,live[n].p)<=Math.max(range[e.id],range[live[n].id]))live.push(e);
 const powered=p=>live.some(e=>dist(e.p,p)<=range[e.id]);
 let homes=0,jobs=0,shops=0,farms=0,mills=0,output=0,upkeep=0,wired=0,buildings=0,health=0,pollution=0;
 const active=new Set();
 for(const {id,p} of entries){
  const a=catalog[id];upkeep+=Math.ceil(a.cost*.003);if(id==='road'||range[id]||zonePlans[id])continue;
  buildings++;const online=powered(p),road=access(p);if(online)wired++;if(online&&road)active.add(id);
  const f=road?(online?1:.35):.05;
  homes+=(a.capacity||0)*f;
  if(a.group==='ค้าขาย'){shops+=f;jobs+=12*f;output+=14*f}
  if(a.group==='เกษตร'){farms+=f;jobs+=7*f;output+=18*f}
  if(a.group==='เหมือง'||a.group==='อุตสาหกรรม'){jobs+=24*f;output+=46*f;pollution+=2*f;if(id==='mill')mills+=f}
  if(a.group==='ชุมชน'){health+=f;jobs+=3*f}
 }
 const power=Math.round(100*wired/Math.max(1,buildings)),needs={zoneR:clamp(Math.round(85+(c.pop-homes)*.8+(jobs-c.pop*.65)*.2-(c.tax-8)*3),0,100),zoneC:clamp(Math.round(65+c.pop*.38-shops*16),0,100),zoneI:clamp(Math.round(65+c.pop*.7-jobs*.72),0,100)};
 const income=Math.round(c.pop*c.tax*.46+output+Math.min(farms,mills*3)*22),expense=Math.round(upkeep+health*24+c.services*(45+c.pop*.18));
 const target=clamp(45+power*.18+Math.min(15,health*c.services*1.4)+Math.min(10,jobs/Math.max(1,c.pop)*10)-(c.tax-8)*2-pollution,10,98);
 return {roads,access,powered,active,homes,jobs,power,needs,income,expense,target};
}
let stats=model(city),timer=null,view='แผนเมือง',group='แบ่งเขต',tool=null,inspect=null,layer='ปกติ',noteTimer;
function message(s){el('notice').textContent=s;clearTimeout(noteTimer);noteTimer=setTimeout(()=>el('notice').textContent='',3200)}
function nextMonth(){
 if(city.pending!==null){view='สภาเมือง';refresh();return}
 const a=stats;city.month++;city.cash+=a.income-a.expense;
 const target=Math.min(a.homes,a.jobs*1.7+24)*(city.tax>14?.82:1);
 city.pop=Math.max(0,Math.round(city.pop+(target-city.pop)*.16));city.approval=Math.round(city.approval*.72+a.target*.28);
 const sites=Object.entries(city.cells).filter(([k,id])=>zonePlans[id]&&a.needs[id]>=30&&a.access(k.split(',').map(Number))&&a.powered(k.split(',').map(Number))).sort((x,y)=>a.needs[y[1]]-a.needs[x[1]]);
 if(sites.length){const [k,id]=sites[0],choices=zonePlans[id],built=choices[Math.min(choices.length-1,Math.floor(city.pop/180))];city.cells[k]=built;city.news='เอกชนเปิด'+catalog[built].name+' บนแปลง '+k}
 if(city.month%3===0){city.pending=(Math.floor(city.month/3)-1)%cases.length;pause();collapsed=false;view='สภาเมือง';city.news=cases[city.pending].title}
 refresh();save();
}
function terms(e){return Math.round(e.cost*(stats.active.has(e.service)?.55:1))}
function resolveCase(full){
 if(city.pending===null)return;const e=cases[city.pending],cost=full?terms(e):0;if(cost>city.cash&&full)return;
 const festival=city.pending%2===1,bonus=festival?(full?Math.round(city.pop*2.4):70):0;
 city.cash+=bonus-cost;city.approval=clamp(city.approval+(full?4:festival?1:-3),0,100);
 city.news=e.title+' · '+(full?e.a:e.b)+' · เงินคลัง '+(bonus-cost>=0?'+':'')+fmt(bonus-cost)+' ฿';city.pending=null;refresh();save();
}
function pause(){clearInterval(timer);timer=null;el('play').textContent='▶'}
function drawAsset(ctx, id, x, y, s = 1, seed = 0, orientation=0, mesh=null, windows=null) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  let rng = ((Number(seed) || 0) + 91) >>> 0;
  const random = () => ((rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0) / 4294967296);
  const turn=([u,v])=>[[u,v],[-v,u],[-u,-v],[v,-u]][orientation];
  const p = ([u,v,z=0]) => {const [a,b]=turn([u,v]);return [a-b,(a+b)*.5-z]};
  function shape(points, fill, stroke, width=.6) {
    if(mesh)return;
    ctx.beginPath();
    points.forEach(([a,b],i) => i ? ctx.lineTo(a,b) : ctx.moveTo(a,b));
    if(fill) { ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
      if(fill.startsWith('#')&&points.length>=4){

    for(let k=0;k<5;k++) line([-12+k*4,5,2],[-12+k*4,5,8],'#6b7972',1.1);
  } else if(id==='poleWood'||id==='poleConcrete'||id==='pylon') {
    const h=id==='pylon'?38:id==='poleConcrete'?23:17;
    line([0,0,0],[h*.44,h*.14,0],'rgba(30,50,42,.24)',2);
    if(id==='pylon') {
      for(const v of [-2.5,2.5]) {
        line([-5,v],[0,v*.25,h],'#65716b',1.3);line([5,v],[0,v*.25,h],'#74817a',1.4);
        for(let z=1;z<27;z+=6) {
          const spread=5*(1-z/h),next=5*(1-(z+6)/h);
          line([-spread,v,z],[next,v*.8,z+6],'#7f8b82',.75);
          line([spread,v,z],[-next,v*.8,z+6],'#6a776e',.75);
        }
      }
      for(const [z,w] of [[23,9],[29,7],[35,5]]) {
        line([-w,0,z],[w,0,z],'#596b64',1.4);
        line([-w,0,z],[0,0,z+3],'#788880',.8); line([w,0,z],[0,0,z+3],'#788880',.8);
        for(const a of [-w,w]) line([a,0,z],[a,0,z-2.6],'#9da99a',1.4);
      }
    } else {
      box(-.65,-.65,1.45,1.45,0,h,id==='poleWood'?wood:concrete);
      for(const z of [h-1,h-4]) {
        line([-5,.1,z],[5,.1,z],id==='poleWood'?'#756346':'#758078',1.3);
        for(const a of [-4,0,4]) line([a,0,z],[a,0,z+1.5],'#a9b6a8',1.05);
      }
    }
  }
  ctx.restore();
}


const map=el('world'),g=map.getContext('2d'),cache=new Map();
let w=0,h=0,z=1,x0=0,y0=0,hover=null,frame=0;
const noise=(i,j)=>{const a=Math.sin(i*127.1+j*311.7)*43758.5453;return a-Math.floor(a)};
function art(id,seed=0){
 const variant=id==='tree'||id==='wood'?seed%4:0,k=id+variant;if(cache.has(k))return cache.get(k);
 const c=document.createElement('canvas');c.width=192;c.height=192;
 drawAsset(c.getContext('2d'),id,96,140,2,variant);cache.set(k,c);return c;
}
function pos(i,j){return [x0+(i-j)*40*z,y0+(i+j)*20*z]}
function tile(x,y){const a=(x-x0)/(40*z),b=(y-y0)/(20*z);return [Math.round((a+b)/2),Math.round((b-a)/2)]}
function paint(){if(!frame)frame=requestAnimationFrame(()=>{frame=0;draw()})}
function diamond(x,y,c,edge){g.beginPath();g.moveTo(x,y-20*z);g.lineTo(x+40*z,y);g.lineTo(x,y+20*z);g.lineTo(x-40*z,y);g.closePath();g.fillStyle=c;g.fill();if(edge){g.strokeStyle=edge;g.lineWidth=.75;g.stroke()}}
function draw(){
 g.fillStyle='#d3e0ce';g.fillRect(0,0,w,h);
 const visible=[];
 for(let sum=-20;sum<70;sum++)for(let i=-9;i<36;i++){
  const j=sum-i;if(j< -9||j>=36)continue;const [x,y]=pos(i,j);if(x< -70*z||x>w+70*z||y< -40*z||y>h+90*z)continue;
  const t=terrain(i,j),inside=i>=0&&i<N&&j>=0&&j<N,k=key(i,j),id=city.cells[k],r=noise(i,j);
  const greens=inside?['#adca94','#aeca95','#afcb96']:['#99ba91','#9bbb92','#9cbc93'];
  diamond(x,y,greens[Math.floor(r*3)],tool&&inside?'#e8efd755':null);
  if(t==='water'){g.strokeStyle='#d2eeea88';g.lineWidth=z;g.beginPath();g.moveTo(x-12*z,y+r*6*z);g.quadraticCurveTo(x-7*z,y+(r*6+1)*z,x+2*z,y+r*6*z);g.stroke()}
  else if(!id&&r>.46){g.fillStyle='#768f6a75';for(let n=0;n<3;n++)g.fillRect(x+(noise(i+n,j)*24-12)*z,y+(noise(i,j+n)*10-5)*z,1.4*z,z)}
  visible.push({i,j,x,y,k,id,t,r,inside});
 }
 // Draw continuous banks and three road passes so junctions share a single surface.
 for(const [width,color] of [[1.42,'#d4cd9d'],[1.10,'#77b8be'],[.72,'#70b3bb']]){
  g.fillStyle=color;g.beginPath();
  for(const side of [1,-1])for(let n=0;n<=184;n++){
   const i=side===1?-10+n*.25:36-n*.25,j=3.3+Math.sin(i*.28)*1.45+i*.12+side*width;
   const [x,y]=pos(i,j);if(side===1&&n===0)g.moveTo(x,y);else g.lineTo(x,y);
  }g.closePath();g.fill();
 }
 for(const [width,color] of [[15,'#c1baa2'],[11,'#637478'],[.9,'#f1d499']]){
  g.strokeStyle=color;g.lineWidth=width*z;g.lineCap='round';g.setLineDash(width<1?[6*z,12*z]:[]);g.beginPath();
  for(const {i,j,x,y,id} of visible)if(id==='road'){
   if(width>=1){g.moveTo(x,y);g.lineTo(x+.02,y)}
   for(const [di,dj] of [[1,0],[0,1]])if(city.cells[key(i+di,j+dj)]==='road'){const [ex,ey]=pos(i+di,j+dj);g.moveTo(x,y);g.lineTo(ex,ey)}
  }g.stroke();
 }g.setLineDash([]);
 for(const {x,y,i,j,inside,id,k,t,r} of visible){
  if(layer!=='ปกติ'&&inside&&(id||tool)){const ok=layer==='ไฟฟ้า'?stats.powered([i,j]):id==='road'?stats.roads.has(k):stats.access([i,j]);diamond(x,y,ok?'#227d805c':'#db6c4f65')}
  if(inside&&(inspect===k||hover===k))diamond(x,y,'#fcf0a044','#fff4bb');
  const item=id||(!inside&&t==='land'&&r>.48||inside&&t==='land'&&r>.86?'tree':null);
  if(item&&item!=='road'){
   const size=item==='tree'?.82+r*.18:1;g.fillStyle='#415c4333';g.beginPath();g.ellipse(x,y+z,(item==='tree'?8:range[item]?4:18)*z,(item==='tree'?3:range[item]?2:7)*z,0,0,7);g.fill();
   g.drawImage(art(item,Math.floor(r*100)),x-48*z*size,y-70*z*size,96*z*size,96*z*size);
  }
  if(inside&&hover===k&&catalog[tool]&&!id&&tool!=='road'&&t!=='water'){g.globalAlpha=.48;g.drawImage(art(tool),x-48*z,y-70*z,96*z,96*z);g.globalAlpha=1}
 }
}
function home(){z=w<730?.82:Math.min(1.54,w/920);x0=w*(w<730?.49:.60)+70*z;y0=h*.45-526*z;paint()}
function resize(){const oldW=w,oldH=h;w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);map.width=w*d;map.height=h*d;g.setTransform(d,0,0,d,0,0);if(!oldW)home();else{x0+=(w-oldW)/2;y0+=(h-oldH)/2;paint()}}
function zoom(f,x=w*.55,y=h*.45){const nz=clamp(z*f,.45,3);x0=x+(x0-x)*nz/z;y0=y+(y0-y)*nz/z;z=nz;paint()}
function changeTile(i,j){
 if(i<0||i>=N||j<0||j>=N)return;const k=key(i,j),id=city.cells[k];inspect=k;
 if(!tool){collapsed=false;view='แผนเมือง';refresh();return}
 if(tool==='sell'){if(!id||k===ENTRANCE){message('เลือกอาคารหรือถนนที่ขายได้');return}collapsed=false;view='แผนเมือง';refresh();return}
 if(id||terrain(i,j)==='water'&&tool!=='road'){message(id?'แปลงนี้ถูกใช้งานแล้ว':'สร้างได้เฉพาะสะพานบนลำน้ำ');return}
 const cost=buildCost(tool,i,j);if(city.cash<cost){message('เงินคลังไม่พอ');return}
 city.cells[k]=tool;city.cash-=cost;city.news='สร้าง'+cellName(tool,i,j)+' · −฿'+fmt(cost);refresh();save();
}
let drag=null;
map.onpointerdown=e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,ox:x0,oy:y0,moved:false};map.setPointerCapture(e.pointerId)};
map.onpointermove=e=>{if(drag&&drag.id===e.pointerId){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){x0=drag.ox+dx;y0=drag.oy+dy;hover=null;paint();return}}hover=tile(e.clientX,e.clientY).join(',');paint()};
map.onpointerup=e=>{if(drag?.id!==e.pointerId)return;const tap=!drag.moved;drag=null;if(tap)changeTile(...tile(e.clientX,e.clientY))};
map.onpointercancel=()=>drag=null;map.onpointerleave=()=>{hover=null;paint()};
map.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)};map.addEventListener('wheel',e=>e.preventDefault(),{passive:false});

const modes=['แผนเมือง','งบประมาณ','สภาเมือง'],groups=['แบ่งเขต','ที่อยู่อาศัย','ค้าขาย','เกษตร','อุตสาหกรรม','เหมือง','โครงสร้าง','ชุมชน','จัดการ'];
let collapsed=innerWidth<730;
function button(parent,label,fn,selected){
 const b=document.createElement('button');b.textContent=label;b.onclick=fn;if(selected!==undefined)b.setAttribute('aria-pressed',String(selected));parent.append(b);return b;
}
function toolbar(){
 const tabs=el('tabs'),cards=el('cards');tabs.replaceChildren();cards.replaceChildren();
 for(const name of groups)button(tabs,name,()=>{group=name;tool=null;toolbar();paint()},name===group);
 for(const [id,name,cost] of GROUPS[group]||[['sell','รื้อถอน',0]]){
  const b=button(cards,'',()=>{tool=tool===id?null:id;inspect=null;if(innerWidth<730)collapsed=true;refresh();toolbar();if(tool)message(id==='sell'?'แตะแปลงเพื่อดูราคาขาย':name+' · แตะแผนที่เพื่อวาง')},tool===id);
  const c=document.createElement('canvas');c.width=96;c.height=68;const p=c.getContext('2d');
  if(id==='road'||id==='sell'){p.fillStyle=id==='road'?'#d1ba8a':'#eeaa85';p.font='bold 43px Arial';p.fillText(id==='road'?'╱':'×',26,49)}else p.drawImage(art(id),0,-17,96,96);
  const title=document.createElement('strong');title.textContent=name;const price=document.createElement('small');price.textContent=id==='sell'?'คืนทุน 50%':'฿ '+fmt(cost);b.append(c,title,price);
 }
 map.classList.toggle('build',!!tool);
}
function refresh(){
 stats=model(city);const a=stats;el('cash').textContent='฿'+fmt(city.cash);el('pop').textContent=fmt(city.pop);el('happy').textContent=Math.round(city.approval)+'%';
 el('date').textContent=new Intl.DateTimeFormat('th-TH',{month:'short',year:'numeric'}).format(new Date(2026,city.month,1));
 const nav=el('nav');nav.replaceChildren();for(const v of modes)button(nav,v+(v==='สภาเมือง'&&city.pending!==null?' ●':''),()=>{collapsed=view===v?!collapsed:false;view=v;refresh()},!collapsed&&view===v);
 const p=el('panel');p.hidden=collapsed;p.replaceChildren();
 const text=(tag,s,cls)=>{const n=document.createElement(tag);n.textContent=s;if(cls)n.className=cls;p.append(n);return n};
 const row=(k,v)=>{const n=text('div','','row');const name=document.createElement('span'),value=document.createElement('b');name.textContent=k;value.textContent=v;n.append(name,value)};
 const bar=(name,val)=>{row(name,val+'%');const wrap=text('div','','bar');const fill=document.createElement('i');fill.style.width=val+'%';wrap.append(fill)};
 if(view==='แผนเมือง'){
  text('small','DISTRICT PLAN','eyebrow');
  if(inspect){const [i,j]=inspect.split(',').map(Number),id=city.cells[inspect];text('h2',id?cellName(id,i,j):terrain(i,j)==='water'?'ลำน้ำ':'แปลงว่าง');row('พิกัด',inspect);row('ถนน',a.roads.has(inspect)||a.access([i,j])?'เชื่อมต่อ':'ขาดทางเข้า');row('ไฟฟ้า',a.powered([i,j])?'เข้าถึง':'นอกเขต');
   if(id==='plant')text('p','โรงไฟฟ้าต้องติดถนนและมีเหมืองถ่านหินเชื่อมถึงทางเข้าเมือง');if(zonePlans[id])text('p','พัฒนาได้เดือนละหนึ่งแปลง เมื่อมีถนน ไฟ และความต้องการอย่างน้อย 30%');
   if(tool==='sell'&&id&&inspect!==ENTRANCE){const target=inspect;button(p,'ยืนยันขาย · ฿'+fmt(saleValue(id,i,j)),()=>{if(city.cells[target]!==id)return;delete city.cells[target];city.cash+=saleValue(id,i,j);city.news='ขาย'+catalog[id].name;inspect=null;refresh();save()})}
   button(p,'กลับภาพรวม',()=>{inspect=null;refresh()});
  }else{text('h2','ผังเมืองปงยางคก');bar('ความต้องการบ้าน',a.needs.zoneR);bar('ความต้องการค้าขาย',a.needs.zoneC);bar('ความต้องการงาน',a.needs.zoneI);row('ดุลต่อเดือน',(a.income>=a.expense?'+':'')+fmt(a.income-a.expense)+' ฿')}
  if(!inspect)text('p',city.news);text('p','ชั้นข้อมูล');for(const l of ['ปกติ','ไฟฟ้า','ถนน'])button(p,l,()=>{layer=l;refresh()},layer===l).classList.toggle('on',l===layer);
  if(layer!=='ปกติ')text('p','เขียว = เชื่อมต่อ · ส้ม = ขาดการเชื่อมต่อ');
 }else if(view==='งบประมาณ'){
  text('small','CITY FINANCE','eyebrow');text('h2','งบประมาณรายเดือน');row('รายรับ','฿'+fmt(a.income));row('รายจ่าย','฿'+fmt(a.expense));row('ดุลสุทธิ','฿'+fmt(a.income-a.expense));
  for(const [field,label,lo,hi] of [['tax','ภาษี',2,22],['services','งบบริการ',0,5]]){
   const n=text('div','','policy');const dec=button(n,'−',()=>{city[field]--;refresh();save()});dec.disabled=city[field]<=lo;const v=document.createElement('strong');v.textContent=label+' '+city[field]+(field==='tax'?'%':' / 5');n.append(v);const inc=button(n,'+',()=>{city[field]++;refresh();save()});inc.disabled=city[field]>=hi
  }text('p','ภาษีสูงเพิ่มรายรับ แต่ชะลอการย้ายเข้า งบบริการเพิ่มความสุขและรายจ่ายประจำ');
 }else{
  text('small','CITY COUNCIL','eyebrow');const e=cases[city.pending];
  if(!e){text('h2','ข่าวจากชุมชน');text('p',city.news);row('วาระถัดไป','อีก '+(3-city.month%3)+' เดือน')}
  else{text('h2',e.title);text('p',e.text);const festival=city.pending%2===1;for(const full of [true,false]){
   const cost=full?terms(e):0,bonus=festival?(full?Math.round(city.pop*2.4):70):0;
   const b=button(p,'',()=>resolveCase(full));b.disabled=full&&city.cash<cost;b.className='choice';const title=document.createElement('strong'),detail=document.createElement('small');title.textContent=full?e.a:e.b;detail.textContent='ใช้ ฿'+fmt(cost)+(bonus?' · รับ ฿'+fmt(bonus):'')+' · ความสุข '+(full?'+4':festival?'+1':'−3');b.append(title,detail)
  }}
 }
 el('next').textContent=city.pending===null?'เดือนถัดไป':'พิจารณาวาระ';paint();
}
el('play').onclick=()=>{if(city.pending!==null){collapsed=false;view='สภาเมือง';refresh();return}if(timer){pause();return}timer=setInterval(nextMonth,4500);el('play').textContent='Ⅱ'};
el('next').onclick=()=>{if(city.pending!==null)collapsed=false;nextMonth()};
el('home').onclick=home;el('plus').onclick=()=>zoom(1.25);el('minus').onclick=()=>zoom(.8);
addEventListener('keydown',e=>{if(e.key==='Escape'){tool=null;inspect=null;toolbar();refresh()}});
