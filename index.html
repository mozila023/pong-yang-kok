<script>
const GROUPS={
  'ที่อยู่อาศัย':[['wood','บ้านไม้ยกพื้น',800,12],['modern','บ้านปูนโมเดิร์น',1400,20],['row','ตึกแถวคูหา',2400,34],['condo','คอนโด',5800,88]],
  'ค้าขาย':[['market','กาดชุมชน',1300],['shop','ร้านโชห่วย',850],['mall','ห้างสรรพสินค้า',6200]],
  'เกษตร':[['cane','ไร่อ้อย',650],['cassava','ไร่มันสำปะหลัง',520],['soy','ไร่ถั่วเหลือง',440],['pineapple','ไร่สับปะรด',760],['orchard','สวนผลไม้',980],['veg','แปลงผัก',380],['livestock','ฟาร์มปศุสัตว์',1250]],
  'เหมือง':[['coal','เหมืองถ่านหิน',1950],['gold','เหมืองทองคำ',3400],['silver','เหมืองเงิน',2700],['copper','เหมืองทองแดง',2100]],
  'โครงสร้าง':[['road','ถนนลาดยาง',120],['poleWood','เสาไม้ · 3 ช่อง',250],['poleConcrete','เสาคอนกรีต · 5 ช่อง',480],['pylon','เสาแรงสูง · 8 ช่อง',1200],['plant','โรงไฟฟ้าถ่านหิน',3700]],
  'ชุมชน':[['park','สวนสาธารณะ',650],['school','โรงเรียน',1700],['clinic','สถานีอนามัย',1900],['temple','วัดล้านนา',2400]]
};
const catalog=Object.fromEntries(Object.entries(GROUPS).flatMap(([group,rows])=>rows.map(([id,name,cost,capacity])=>[id,{id,name,cost,capacity,group}])));
const N=26, range={poleWood:3,poleConcrete:5,pylon:8,plant:3}, key=(i,j)=>i+','+j;
const roles=['นายกเทศมนตรีตำบล','ผู้บริหารระดับอำเภอ','ผู้บริหารระดับจังหวัด','สมาชิกสภาผู้แทนราษฎร','นายกรัฐมนตรี'];
function terrain(i,j){let d=j-(3.3+Math.sin(i*.28)*1.45+i*.12);return Math.abs(d)<1.12?'water':Math.abs(d)<1.7?'bank':'land'}
function saleValue(id){return Math.floor(catalog[id].cost/2)}
function sellTile(s,k,expected){
 if(s.opposition||!catalog[expected]||s.cells[k]!==expected)return false;
 delete s.cells[k];s.cash+=saleValue(expected);
 s.news='ขาย'+catalog[expected].name+' • เงินคืน ฿'+saleValue(expected).toLocaleString('th-TH');return true;
}
function newCity(){
 let cells={},put=(i,j,id)=>cells[key(i,j)]=id;
 for(let i=2;i<24;i++)put(i,14,'road');
 for(let j=7;j<24;j++)put(13,j,'road');
 for(let i=6;i<=19;i++)put(i,19,'road');
 for(let j=11;j<20;j++)put(7,j,'road');
 [[8,13,'wood'],[9,13,'wood'],[10,13,'market'],[11,13,'shop'],[12,13,'row'],[14,13,'modern'],[15,13,'wood'],[16,13,'temple'],[8,15,'modern'],[9,15,'wood'],[11,15,'wood'],[12,15,'market'],[14,15,'row'],[15,15,'wood'],[16,15,'park'],[12,11,'school'],[14,11,'clinic'],[8,18,'soy'],[9,18,'cane'],[10,18,'veg'],[11,18,'pineapple'],[12,18,'orchard'],[14,18,'livestock'],[15,18,'cassava'],[16,18,'veg'],[20,13,'coal'],[21,13,'plant'],[18,13,'poleConcrete'],[14,12,'poleConcrete'],[10,15,'poleConcrete'],[12,17,'poleWood']].forEach(a=>put(...a));
 return {v:1,cells,cash:24000,tax:8,services:2,month:0,pop:108,approval:66,level:0,opposition:false,campaign:0,wins:0,trust:2,influence:0,actionMonth:-1,party:4000,news:'ชาวบ้านเปิดกาดเช้า เทศบาลพร้อมรับฟังความคิดเห็น'};
}
function analyze(s){
 const entries=Object.entries(s.cells).map(([k,id])=>({k,id,p:k.split(',').map(Number)}));
 const adj=([x,y])=>[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
 const roads=new Set(),queue=['2,14'];
 for(let n=0;n<queue.length;n++){let k=queue[n];if(roads.has(k)||s.cells[k]!=='road')continue;roads.add(k);adj(k.split(',').map(Number)).forEach(p=>queue.push(p.join(',')))}
 const access=p=>adj(p).some(a=>roads.has(a.join(',')));
 const fuel=entries.some(e=>e.id==='coal'&&access(e.p));
 const nodes=entries.filter(e=>range[e.id]), live=nodes.filter(e=>e.id==='plant'&&fuel&&access(e.p));
 const distance=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
 for(let n=0;n<live.length;n++)for(const e of nodes)if(!live.includes(e)&&e.id!=='plant'&&distance(e.p,live[n].p)<=range[e.id])live.push(e);
 const powered=p=>live.some(e=>distance(e.p,p)<=range[e.id]);
 let capacity=0,jobs=0,trade=0,care=0,dirty=0,served=0,used=0,upkeep=0;
 for(const e of entries){let a=catalog[e.id];upkeep+=Math.ceil(a.cost*.004);if(e.id==='road'||range[e.id])continue;
 let connected=access(e.p),lit=powered(e.p),factor=connected?(lit?1:.35):.08;
 used++;if(lit)served++;
 capacity+=(a.capacity||0)*factor;
 if(['เกษตร','เหมือง','ค้าขาย'].includes(a.group)){jobs+=Math.round((8+a.cost/130)*factor);trade+=Math.round(a.cost*.042*factor)}
 if(a.group==='ชุมชน')care+=factor;
 if(a.group==='เหมือง')dirty+=2;
 }
 const coverage=used?Math.round(100*served/used):0, income=Math.round(s.pop*s.tax*.43+trade),expense=Math.round(upkeep+s.services*100);
 const target=Math.max(8,Math.min(96,38+coverage*.18+Math.min(1,jobs/Math.max(1,s.pop*.65))*13+Math.min(10,care*2)+s.services*4-(s.tax-8)*2-dirty-(s.cash<0?14:0)));
 return {roads,live,powered,access,capacity:Math.floor(capacity),jobs,coverage,income,expense,target};
}
function advance(s){
 const a=analyze(s);s.month++;s.party+=100;s.cash+=a.income-a.expense;s.pop+=Math.sign(a.capacity-s.pop)*Math.min(Math.abs(a.capacity-s.pop),Math.ceil(Math.abs(a.capacity-s.pop)*.12));
 s.approval=Math.round((s.approval+a.target)*5)/10;
 if(s.month%12===0){
 const caught=s.influence>0&&Math.random()<Math.min(.85,s.influence*.05);
 const score=caught?0:Math.round((s.opposition?36+(60-s.approval)*.5:s.approval)+s.campaign+s.trust+s.influence);
 const won=score>=50;s.news='เลือกตั้งประจำปี • ได้เสียง '+Math.min(100,Math.max(0,score))+'% ';
 if(won){s.opposition=false;s.wins++;if(s.wins>=2&&s.level<roles.length-1){s.level++;s.wins=0}s.news+='ชนะเลือกตั้ง รับตำแหน่ง'+roles[s.level]}
 else{s.opposition=true;s.wins=0;s.news=caught?'คดีซื้อเสียงถูกเปิดเผย ถูกตัดสิทธิ์รอบนี้ และเสียความเชื่อมั่น':s.news+'คู่แข่งชนะ คุณทำหน้าที่ฝ่ายค้าน'}if(caught)s.trust=-8;s.campaign=0;s.influence=0;
 }
}
function politics(s,kind){
 if(s.actionMonth===s.month)return 'เดือนนี้ลงพื้นที่แล้ว';
 const cost=kind==='buy'?900:180;if(s.party<cost)return 'เงินพรรคไม่พอ';
 s.actionMonth=s.month;s.party-=cost;
 if(kind==='buy'){s.influence+=6;s.news='ซื้อเสียงในเกม • ฐานเสียงชั่วคราวเพิ่ม ความเสี่ยงคดีสูงขึ้น'}
 else{s.trust=Math.min(14,s.trust+1);s.campaign+=2;s.news='สภาชุมชนรับข้อเสนอ ชาวบ้านจดจำผลงานของคุณ'}
 return s.news;
}

/* Original hand-built isometric artwork. Coordinates are in half-tile world units. */
function drawAsset(ctx, id, x, y, s = 1, seed = 0, orientation=0, mesh=null) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  let rng = ((Number(seed) || 0) + 91) >>> 0;
  const random = () => ((rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0) / 4294967296);
  const turn=([u,v])=>[[u,v],[-v,u],[-u,-v],[v,-u]][orientation];
  const p = ([u,v,z=0]) => {const [a,b]=turn([u,v]);return [a-b,(a+b)*.5-z]};
  function shape(points, fill, stroke, width=.6) {
    if(mesh)return;
    ctx.beginPath();
    points.forEach(([a,b],i) => i ? ctx.lineTo(a,b) : ctx.moveTo(a,b));
    if(fill) { ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
      if(fill.startsWith('#')&&points.length>=4){
        const ys=points.map(point=>point[1]),top=Math.min(...ys),bottom=Math.max(...ys);
        if(bottom-top>3){const light=ctx.createLinearGradient(0,top,0,bottom);
          light.addColorStop(0,'rgba(255,236,191,.23)');light.addColorStop(.64,'rgba(251,232,203,0)');light.addColorStop(1,'rgba(40,43,48,.17)');ctx.fillStyle=light;ctx.fill()}
      }
    }
    if(stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=width; ctx.stroke(); }
  }
  const face = (points, fill, stroke, width) => mesh?mesh.face(points,fill,stroke,width):shape(points.map(p),fill,stroke,width);
  const line = (a,b,color,w=1) => face([a,b],null,color,w);
  function oval(cx,cy,rx,ry,color) {
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
  }
  function ground(u,v,z,rx,ry,color) { if(mesh){if(color[0]==='#')mesh.blob(u,v,z,rx,ry,ry*.55,color);return}const [cx,cy] = p([u,v,z]); oval(cx,cy,rx,ry,color); }
  function slab(u,v,w,d,z,color) {
    face([[u,v,z],[u+w,v,z],[u+w,v+d,z],[u,v+d,z]],color);
  }
  function box(u,v,w,d,z,h,colors) {
    const [top,lit,dark]=colors, a=u+w,b=v+d,t=z+h;
    if(mesh){mesh.box(u,v,w,d,z,h,colors);return}
    const sideV=orientation===0||orientation===3?b:v,sideU=orientation<2?a:u;
    face([[u,sideV,z],[a,sideV,z],[a,sideV,t],[u,sideV,t]],sideV===b?lit:dark);
    face([[sideU,v,z],[sideU,b,z],[sideU,b,t],[sideU,v,t]],sideU===a?dark:lit);
    slab(u,v,w,d,t,top);
  }
  const plaster=['#f6ebcc','#e1cd9f','#aa9676'];
  const wood=['#b48554','#99643e','#664633'];
  const white=['#fff4df','#e8dfc9','#acae9f'];
  const concrete=['#c9c9ac','#acae94','#878e7e'];
  const dark=['#71868a','#546c70','#364c54'];
  const waterGlass=['#90bdc1','#668e97','#426c79'];
  const cast=(u,v,w,d,h) => face([[u,v],[u+w,v],[u+w+h*.43,v+h*.18],[u+w+h*.43,v+d+h*.18],[u+h*.43,v+d+h*.18],[u,v+d]],'rgba(40,52,39,.18)');
  function roof(u,v,w,d,z,rise,c) {
    const mid=v+d/2, a=u+w,b=v+d;
    const near=orientation===0||orientation===3?b:v,far=near===b?v:b,end=orientation<2?a:u;
    if(mesh)face([[u,v,z],[u,b,z],[u,mid,z+rise]],c[2]);
    face([[end,v,z],[end,b,z],[end,mid,z+rise]],c[2]);
    face([[u,far,z],[a,far,z],[a,mid,z+rise],[u,mid,z+rise]],c[2]);
    face([[u,mid,z+rise],[a,mid,z+rise],[a,near,z],[u,near,z]],c[0]);
    for(let i=2;i<w;i+=1.7) line([u+i,mid,z+rise],[u+i,near,z],c[1],.45);
    line([u,mid,z+rise],[a,mid,z+rise],c[3],1.3);
    line([u,near,z],[a,near,z],c[3],.9);
    line([end,near,z],[end,mid,z+rise],c[3],.85);
  }
  const tile=['#b85939','#89422e','#863e2e','#d99b64'];
  const teal=['#588c80','#3f7067','#345e5d','#a2b79c'];
  function windowRow(u,v,w,d,z,count,height) {
    const fv=orientation===0||orientation===3?v+d:v,fu=orientation<2?u+w:u;
    for(let i=0;i<count;i++) {
      const a=u+1.7+i*(w-2)/count, dw=(w-2)/count*.67;
      face([[a,fv,z],[a+dw,fv,z],[a+dw,fv,z+height],[a,fv,z+height]],'#4e7277');
      line([a+.3,fv,z+height-.5],[a+dw-.4,fv,z+height-.5],'#a6c6bc',.62);
      line([a+dw*.54,fv,z],[a+dw*.54,fv,z+height],'#b9b7a1',.55);
    }
    for(let i=0;i<Math.max(1,Math.floor(d/6));i++) {
      const b=v+2+i*6;
      face([[fu,b,z],[fu,b+3.1,z],[fu,b+3.1,z+height],[fu,b,z+height]],'#3d5960');
    }
  }
  function crown(u,v,h,r,fruit=false) {
    const [cx,cy]=p([u,v,h]);
    const palettes = [
      ['#355943','#427553','#578b55','#79a361','#a5ba73'],
      ['#3e6244','#527c4b','#739958','#95af64','#bdc47c'],
      ['#355f56','#437d63','#5b9168','#81a972','#a2bd82']
    ];
    const col=palettes[Math.floor(random()*palettes.length)];
    line([u,v,0],[u,v,h+1],'#715a3d',r*.22);
    line([u,v,h*.47],[u-r*.45,v,h*.79],'#715a3d',r*.13);
    for(let k=0;k<58;k++){

function tile(x,y){return world(x,y).map(Math.round)}
function turnCamera(){const x=innerWidth*.55,y=innerHeight*.5,point=world(x,y);orientation=(orientation+1)%4;const [u,v]=loc(...point);ox+=x-u;oy+=y-v;hover=null;render()}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function stroke(x,y,ex,ey,color,w,dashed=false){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dashed?[4*scale,6*scale]:[]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([])}
function diamond(x,y,s,color){polygon([[x,y-20*s],[x+40*s,y],[x,y+20*s],[x-40*s,y]],color)}
const spriteCache=new Map();
let trafficTime=0,pendingSale=null;
function sprite(c,id,x,y,s,seed){
 const art=photoFor(id,seed);
 if(art){c.drawImage(photoImage,art.x,art.y,art.w,art.h,x-art.width*s/2,y+art.foot*s-art.height*s,art.width*s,art.height*s);return}
 const angle=c===ctx?orientation:0;
 let k=id+'-'+(seed%4)+'-'+angle,im=spriteCache.get(k);if(!im){im=document.createElement('canvas');im.width=160;im.height=220;drawAsset(im.getContext('2d'),id,80,176,1.5,seed%4,angle);spriteCache.set(k,im)}
 c.drawImage(im,x-80*s/1.5,y-176*s/1.5,160*s/1.5,220*s/1.5);
}
function render(){
 updateParcels();if(scene){scene.draw();return}
 let w=innerWidth,h=innerHeight,s=scale;ctx.clearRect(0,0,w,h);
 ctx.fillStyle='#9ab398';ctx.fillRect(0,0,w,h);paintGround();
 const visible=[];for(let sum=-24;sum<=2*N+22;sum++)for(let i=-12;i<N+12;i++){let j=sum-i;if(j< -12||j>=N+12)continue;let [x,y]=loc(i,j);if(x<-65*s||x>w+65*s||y< -25*s||y>h+125*s)continue;
 const r=rand(i,j),t=terrain(i,j),inside=i>=0&&j>=0&&i<N&&j<N,seed=Math.floor(r*1000),id=city.cells[key(i,j)];
 if(selected&&inside&&t!=='water'&&!id)diamond(x,y,s*.96,'rgba(246,244,199,.09)');
 visible.push({i,j,x,y,id,seed,t,r,inside});
 }
 visible.sort((a,b)=>a.y-b.y||a.x-b.x);
 for(const {x,y,id} of visible){
  if(photoImage||!id||id==='road'||range[id]||catalog[id].group==='เกษตร')continue;
  diamond(x,y,s*.94,'#b3ae8c');diamond(x,y-s,s*.90,'#c7c0a1');
 }
 paintStreets(visible);
 for(const {x,y,id,t,inside,r} of visible){
  const tree=!id&&t==='land'&&r>(inside?.81:.48);
  if(photoImage||(!tree&&(!id||id==='road'||catalog[id].group==='เกษตร')))continue;
  const height=id==='condo'?47:id==='pylon'?40:tree?18:22;
  const width=tree?12:range[id]?3:19;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const shade=ctx.createLinearGradient(0,0,height*.68,height*.24);
  shade.addColorStop(0,'rgba(39,53,49,.31)');shade.addColorStop(1,'rgba(39,53,49,.08)');
  polygon([[-width,-1],[width,-2],[width+height*.68,height*.24],[height*.68,height*.24+width*.4],[-width,2]],shade);ctx.restore();
 }
 for(const {i,j,x,y,id,seed,t,r,inside} of visible){
 if(id==='road')paintTraffic(i,j,x,y,s,seed);
 if(id&&id!=='road')sprite(ctx,id,x,y,s,seed);
 else if(!id&&t==='land'&&r>(inside?.81:.48))sprite(ctx,'tree',x,y,s*(.72+r*.25),seed);
 else if(!id&&t==='bank'&&r>.42)sprite(ctx,'bankPlants',x,y,s,seed);
 if(selected&&hover&&i===hover[0]&&j===hover[1]&&inside){diamond(x,y,s,selected==='sell'?'#ec704a88':'#fff6aa77');if(catalog[selected]&&selected!=='road'&&!id&&t!=='water'){ctx.globalAlpha=.62;sprite(ctx,selected,x,y,s,0);ctx.globalAlpha=1}}
 }
 // Sagging lines reveal the network across road and field tiles.
 for(const e of stats.live){if(e.id==='plant')continue;const n=stats.live.slice(0,stats.live.indexOf(e)).filter(k=>Math.abs(k.p[0]-e.p[0])+Math.abs(k.p[1]-e.p[1])<=range[e.id]).at(-1);if(!n)continue;
 let [x,y]=loc(...e.p),[u,v]=loc(...n.p);y-=(e.id==='pylon'?51:34)*s;v-=(n.id==='pylon'?51:34)*s;
 ctx.strokeStyle='#3d493c99';ctx.lineWidth=s;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo((x+u)/2,(y+v)/2+9*s,u,v);ctx.stroke()}
}
function center(){orientation=0;scale=innerWidth<650?1.34:Math.min(2.25,innerWidth/655);ox=innerWidth*(innerWidth<650?.52:.57)+80*scale;oy=innerHeight*.53-520*scale;render()}
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);center()}
function zoom(f,x=innerWidth*.55,y=innerHeight*.5){let z=Math.max(.45,Math.min(5,scale*f));ox=x-(x-ox)*z/scale;oy=y-(y-oy)*z/scale;scale=z;render()}
function refresh(){stats=analyze(city);$('cash').textContent='฿'+fmt(city.cash);$('pop').textContent=fmt(city.pop);$('approval').textContent=Math.round(city.approval)+'%';$('date').textContent=new Intl.DateTimeFormat('th-TH',{month:'short',year:'numeric'}).format(new Date(2026,city.month,1));$('news').textContent=city.news;if($('modal').open)show(tab);render();save()}
function tick(){advance(city);refresh()}
function pause(){clearInterval(timer);timer=null;$('play').textContent='▶'}
$('play').onclick=()=>{if(timer)return pause();timer=setInterval(tick,4500);$('play').textContent='Ⅱ'};$('next').onclick=tick;
$('minus').onclick=()=>zoom(1/1.2);$('plus').onclick=()=>zoom(1.2);$('home').onclick=center;
$('rotate').onclick=turnCamera;
canvas.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)};
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy,moved:false};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){ox=drag.ox+dx;oy=drag.oy+dy}}hover=tile(e.clientX,e.clientY);render()};
canvas.onpointercancel=()=>{drag=null};canvas.onpointerleave=()=>{hover=null;render()};
canvas.onpointerup=e=>{let click=drag&&!drag.moved;drag=null;if(!click)return;let [i,j]=tile(e.clientX,e.clientY),k=key(i,j),id=city.cells[k];if(i<0||j<0||i>=N||j>=N)return tell('นอกเขตเทศบาล');
 if(selected==='sell'){if(city.opposition)return tell('ฝ่ายค้านไม่มีอำนาจขายทรัพย์สินเทศบาล');if(!id)return tell('แปลงนี้ว่าง');pause();pendingSale={k,id};$('saleTitle').textContent='ทุบและขาย'+catalog[id].name;$('saleAmount').textContent='คืนเข้าคลังเทศบาล ฿'+fmt(saleValue(id))+' (50% ของราคาก่อสร้าง)';$('sale').showModal();return}
 if(id){tell(catalog[id].name+(id==='road'?'':(' • '+(stats.access([i,j])?'ติดถนน':'ห่างถนน')+' • '+(stats.powered([i,j])?'มีไฟฟ้า':'ขาดไฟฟ้า'))));return}
 if(!selected)return;if(city.opposition)return tell('ฝ่ายค้านเสนอผลงานได้ที่เมนูการเมือง');if(terrain(i,j)==='water')return tell('สร้างในลำน้ำไม่ได้');
 const item=catalog[selected];if(city.cash<item.cost)return tell('เงินเทศบาลไม่พอ');
 city.cells[k]=selected;city.cash-=item.cost;city.news='สร้าง'+item.name+'แล้ว';refresh()
};
function fold(hide){$('panel').classList.toggle('hide',hide);$('unfold').style.display=hide?'block':'none'}
$('fold').onclick=()=>fold(true);$('unfold').onclick=()=>fold(false);
function selectTool(id){
 selected=id;hover=null;canvas.style.cursor=id?'crosshair':'default';
 $('sellTool').setAttribute('aria-pressed',String(id==='sell'));$('neutral').hidden=!id;
 $('hint').textContent=id==='sell'?'แตะสิ่งก่อสร้างเพื่อดูราคาขาย':id?'แตะแปลงว่างเพื่อสร้าง'+catalog[id].name:'เลือกสิ่งก่อสร้าง หรือแตะอาคารเพื่อดูข้อมูล';
 list();render();
}
$('sellTool').onclick=()=>{selectTool(selected==='sell'?null:'sell');if(innerWidth<720)fold(true)};
$('neutral').onclick=()=>selectTool(null);
$('keep').onclick=()=>$('sale').close();
$('sellNow').onclick=()=>{if(pendingSale&&sellTile(city,pendingSale.k,pendingSale.id))refresh();$('sale').close()};
$('sale').onclose=()=>{pendingSale=null};
addEventListener('keydown',e=>{if(e.key!=='Escape')return;e.preventDefault();drag=null;for(const id of ['sale','modal'])if($(id).open)$(id).close();selectTool(null)});
function list(){let rows=GROUPS[$('group').value];$('items').replaceChildren();for(const [id,name,cost] of rows){let b=document.createElement('button');b.className='item'+(id===selected?' active':'');b.innerHTML='<canvas width="92" height="78"></canvas><span><strong>'+name+'</strong><small>฿ '+fmt(cost)+'</small></span>';let g=b.firstChild.getContext('2d');if(id==='road'){g.fillStyle='#626e68';g.fillRect(14,42,60,13)}else sprite(g,id,46,59,.72,1);b.onclick=()=>{selectTool(id);if(innerWidth<720)fold(true)};$('items').append(b)}}
for(const name of Object.keys(GROUPS))$('group').add(new Option(name,name));$('group').onchange=list;
function show(which){tab=which;const a=stats,s=city;const disabled=s.opposition?'disabled':'',busy=s.actionMonth===s.month?'disabled':'';
 $('detail').innerHTML=which==='politics'?'<h2>สนามเลือกตั้ง</h2><p>'+roles[s.level]+' · '+(s.opposition?'ฝ่ายค้าน':'ฝ่ายบริหาร')+'</p><div class="facts"><div>เลือกตั้งใน<b>'+(12-s.month%12)+' เดือน</b></div><div>เงินพรรค<b>฿ '+fmt(s.party)+'</b></div><div>ความเชื่อมั่นสะสม<b>'+s.trust+'</b></div><div>คะแนนรอบนี้<b>+'+(s.campaign+s.influence)+'</b></div></div><p>ลงพื้นที่ได้เดือนละครั้ง ใช้เงินพรรคแยกจากคลังเทศบาล</p><div class="act"><button class="primary" id="good" '+busy+'>เวทีรับฟัง · ฿180</button><button class="primary" id="bad" '+busy+'>ซื้อเสียง · ฿900</button></div><p><small>เวทีชุมชนให้ +2 คะแนนและความเชื่อมั่นข้ามปี ซื้อเสียงให้ +6 เฉพาะรอบนี้ และเสี่ยงถูกตัดสิทธิ์ ปัจจุบันเสี่ยง '+Math.min(85,Math.round(s.influence*5))+'%</small></p><p>เสียงถึง 50% ชนะเลือกตั้ง ชนะสองสมัยเลื่อนระดับ ผลงานเทศบาลช่วยฝ่ายบริหาร เมื่อแพ้ยังลงพื้นที่ได้</p><small>เส้นทางสมมติในเกม · ตำบล › อำเภอ › จังหวัด › สส. › นายกรัฐมนตรี</small>'
 :'<h2>สภาเมือง</h2><p>งบประมาณต่อเดือน</p><div class="facts"><div>รายรับ<b>฿ '+fmt(a.income)+'</b></div><div>รายจ่าย<b>฿ '+fmt(a.expense)+'</b></div><div>มีไฟฟ้าใช้<b>'+a.coverage+'%</b></div><div>ตำแหน่งงาน<b>'+a.jobs+'</b></div></div><label>ภาษี '+s.tax+'% <input id="tax" type="range" min="2" max="22" value="'+s.tax+'" '+disabled+'></label><label>งบบริการ '+s.services+'/5 <input id="svc" type="range" min="0" max="5" value="'+s.services+'" '+disabled+'></label><p><small>ถนนต้องต่อถึงทางเข้าเมืองด้านตะวันตก เหมืองถ่านหินและโรงไฟฟ้าต้องติดถนน เสารับไฟจากเครือข่ายและจ่ายไฟตามระยะช่องแนวตั้ง–แนวนอน ภาษีสูงทำให้ความนิยมลดลง</small></p><p><small>ลากแผนที่เพื่อเลื่อน • ใช้ปุ่ม + / − เพื่อซูม • แตะอาคารเพื่อดูบริการ • บันทึกอัตโนมัติในเบราว์เซอร์</small></p>';
 if(which==='politics'){for(let [id,kind] of [['good','good'],['bad','buy']])$(id).onclick=()=>{tell(politics(s,kind));refresh()}}
 else{for(let [id,prop] of [['tax','tax'],['svc','services']])$(id).onchange=e=>{if(!s.opposition)s[prop]=Number(e.target.value);refresh()}}
 if(!$('modal').open)$('modal').showModal();
}
$('gov').onclick=()=>show('budget');$('political').onclick=()=>show('politics');$('dismiss').onclick=()=>$('modal').close();
let scene=null;
try{scene=createScene($('world3d'))}catch(err){console.warn('3D renderer unavailable',err)}
function fallback(){scene=null;$('world3d').hidden=true;canvas.style.opacity='1'}
if(scene){canvas.style.opacity='0';$('world3d').addEventListener('webglcontextlost',e=>{e.preventDefault();fallback();render()})}else fallback();
addEventListener('resize',resize);list();fold(innerWidth<720);resize();refresh();
loadPhotos();
setInterval(()=>{if(timer&&!document.hidden){trafficTime+=100;render()}},100);

</script>
</html>
