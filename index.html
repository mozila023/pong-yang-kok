<script>
const GROUPS={
  'ที่อยู่อาศัย':[['wood','บ้านไม้ยกพื้น',800,12],['modern','บ้านปูนโมเดิร์น',1400,20],['row','ตึกแถวคูหา',2400,34],['condo','คอนโด',5800,88]],
  'ค้าขาย':[['market','กาดชุมชน',1300],['shop','ร้านโชห่วย',850],['mall','ห้างสรรพสินค้า',6200]],
  'เกษตร':[['cane','ไร่อ้อย',650],['cassava','ไร่มันสำปะหลัง',520],['soy','ไร่ถั่วเหลือง',440],['pineapple','ไร่สับปะรด',760],['orchard','สวนผลไม้',980],['veg','แปลงผัก',380],['livestock','ฟาร์มปศุสัตว์',1250]],
  'เหมือง':[['coal','เหมืองถ่านหิน',1950],['gold','เหมืองทองคำ',3400],['silver','เหมืองเงิน',2700],['copper','เหมืองทองแดง',2100]],
  'โครงสร้าง':[['road','ถนนลาดยาง',120],['poleWood','เสาไม้ · 3 ช่อง',250],['poleConcrete','เสาคอนกรีต · 5 ช่อง',480],['pylon','เสาแรงสูง · 8 ช่อง',1200],['plant','โรงไฟฟ้าถ่านหิน',3700]],
  'ชุมชน':[['park','สวนสาธารณะ',650],['school','โรงเรียน',1700],['clinic','สถานีอนามัย',1900],['temple','วัดล้านนา',2400]]
};
const catalog=Object.fromEntries(Object.entries(GROUPS).flatMap(([group,rows])=>rows.map(([id,name,cost,capacity])=>[id,{id,name,cost,capacity,group}])));
const N=26, range={poleWood:3,poleConcrete:5,pylon:8,plant:3}, key=(i,j)=>i+','+j;
const roles=['นายกเทศมนตรีตำบล','ผู้บริหารระดับอำเภอ','ผู้บริหารระดับจังหวัด','สมาชิกสภาผู้แทนราษฎร','นายกรัฐมนตรี'];
// The western road tile is the town entrance: every road network is traced from it.
const ENTRANCE='2,14',BRIDGE_COST=420,LOAN=4000,LOAN_RATE=1.1,DEBT_PAYMENT=220;
const COMMUNITY={park:120,school:150,clinic:200,temple:300}; // residents served per building
const SHOP_WEIGHT={shop:1,market:1.5,mall:4};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function terrain(i,j){let d=j-(3.3+Math.sin(i*.28)*1.45+i*.12);return Math.abs(d)<1.12?'water':Math.abs(d)<1.7?'bank':'land'}
// Roads laid over the river become bridges, which cost more to build.
function buildCost(id,i,j){return id==='road'&&i!==undefined&&terrain(i,j)==='water'?BRIDGE_COST:catalog[id].cost}
function cellName(id,i,j){return id==='road'&&i!==undefined&&terrain(i,j)==='water'?'สะพาน':catalog[id].name}
function saleValue(id,i,j){return Math.floor(buildCost(id,i,j)/2)}
function sellTile(s,k,expected){
 if(s.opposition||k===ENTRANCE||!catalog[expected]||s.cells[k]!==expected)return false;
 const [i,j]=k.split(',').map(Number),value=saleValue(expected,i,j);
 delete s.cells[k];s.cash+=value;
 s.news='ขาย'+cellName(expected,i,j)+' • เงินคืน ฿'+value.toLocaleString('th-TH');return true;
}
function newCity(){
 let cells={},put=(i,j,id)=>cells[key(i,j)]=id;
 for(let i=2;i<24;i++)put(i,14,'road');
 for(let j=7;j<24;j++)put(13,j,'road');
 for(let i=6;i<=19;i++)put(i,19,'road');
 for(let j=11;j<20;j++)put(7,j,'road');
 // Poles at 11,12 and 16,17 bridge the gaps so the starting town is fully powered.
 [[8,13,'wood'],[9,13,'wood'],[10,13,'market'],[11,13,'shop'],[12,13,'row'],[14,13,'modern'],[15,13,'wood'],[16,13,'temple'],[8,15,'modern'],[9,15,'wood'],[11,15,'wood'],[12,15,'market'],[14,15,'row'],[15,15,'wood'],[16,15,'park'],[12,11,'school'],[14,11,'clinic'],[8,18,'soy'],[9,18,'cane'],[10,18,'veg'],[11,18,'pineapple'],[12,18,'orchard'],[14,18,'livestock'],[15,18,'cassava'],[16,18,'veg'],[20,13,'coal'],[21,13,'plant'],[18,13,'poleConcrete'],[14,12,'poleConcrete'],[11,12,'poleConcrete'],[10,15,'poleConcrete'],[12,17,'poleWood'],[16,17,'poleConcrete']].forEach(a=>put(...a));
 return {v:1,cells,cash:24000,tax:8,services:2,month:0,pop:108,approval:66,level:0,opposition:false,campaign:0,wins:0,trust:2,influence:0,actionMonth:-1,party:4000,news:'ชาวบ้านเปิดกาดเช้า เทศบาลพร้อมรับฟังความคิดเห็น',rival:55,hist:[],debt:0,loanMonth:-99,speed:0};
}
// Saved games are untrusted: keep only known structures on valid tiles and clamp every number.
function validSave(old){return !!old&&typeof old==='object'&&old.v===1&&!!old.cells&&typeof old.cells==='object'&&!Array.isArray(old.cells)}
function sanitizeCity(old){
 const base=newCity();
 if(!validSave(old))return base;
 const cells={};
 for(const [k,id] of Object.entries(old.cells)){
  const m=/^(-?\d+),(-?\d+)$/.exec(k);if(!m||typeof id!=='string'||!Object.hasOwn(catalog,id))continue;
  const i=+m[1],j=+m[2];if(i<0||j<0||i>=N||j>=N||(terrain(i,j)==='water'&&id!=='road'))continue;
  cells[key(i,j)]=id;
 }
 cells[ENTRANCE]='road';
 const num=(v,d,lo,hi)=>{if(v===null||v===undefined||v==='')return d;v=Number(v);return Number.isFinite(v)?clamp(v,lo,hi):d};
 const int=(v,d,lo,hi)=>Math.round(num(v,d,lo,hi));
 const month=int(old.month,0,0,1e6);
 return {...base,cells,
  cash:num(old.cash,base.cash,-1e9,1e9),tax:int(old.tax,8,2,22),services:int(old.services,2,0,5),month,
  pop:int(old.pop,base.pop,0,1e6),approval:num(old.approval,base.approval,0,100),level:int(old.level,0,0,roles.length-1),
  opposition:old.opposition===true,campaign:num(old.campaign,0,0,500),wins:int(old.wins,0,0,99),trust:num(old.trust,2,-20,14),
  influence:num(old.influence,0,0,500),actionMonth:int(old.actionMonth,-1,-1,1e6),party:num(old.party,4000,0,1e9),
  news:typeof old.news==='string'?old.news.slice(0,240):base.news,rival:num(old.rival,55,20,90),
  hist:Array.isArray(old.hist)?old.hist.map(Number).filter(Number.isFinite).map(v=>clamp(v,0,100)).slice(-6):[],
  debt:num(old.debt,0,0,1e7),loanMonth:int(old.loanMonth,-99,-99,month),speed:int(old.speed,0,0,2)};
}
function analyze(s){
 const entries=Object.entries(s.cells).filter(([,id])=>catalog[id]).map(([k,id])=>({k,id,p:k.split(',').map(Number)}));
 const adj=([x,y])=>[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
 const roads=new Set(),queue=[ENTRANCE];
 for(let n=0;n<queue.length;n++){let k=queue[n];if(roads.has(k)||s.cells[k]!=='road')continue;roads.add(k);adj(k.split(',').map(Number)).forEach(p=>queue.push(p.join(',')))}
 const access=p=>adj(p).some(a=>roads.has(a.join(',')));
 const fuel=entries.some(e=>e.id==='coal'&&access(e.p));
 const nodes=entries.filter(e=>range[e.id]), live=nodes.filter(e=>e.id==='plant'&&fuel&&access(e.p));
 const distance=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
 // Two poles link when either one reaches the other.
 for(let n=0;n<live.length;n++)for(const e of nodes)if(!live.includes(e)&&e.id!=='plant'&&distance(e.p,live[n].p)<=Math.max(range[e.id],range[live[n].id]))live.push(e);
 const powered=p=>live.some(e=>distance(e.p,p)<=range[e.id]);
 let capacity=0,jobs=0,farmTrade=0,shopTrade=0,shopSlots=0,dirty=0,served=0,used=0,upkeep=0;
 const service={park:0,school:0,clinic:0,temple:0},mines=[],parks=[];
 for(const e of entries){let a=catalog[e.id];upkeep+=Math.ceil(buildCost(e.id,...e.p)*.004);if(e.id==='road'||range[e.id])continue;
 let connected=access(e.p),lit=powered(e.p),factor=connected?(lit?1:.35):.08;
 used++;if(lit)served++;
 capacity+=(a.capacity||0)*factor;
 if(['เกษตร','เหมือง','ค้าขาย'].includes(a.group))jobs+=Math.round((8+a.cost/130)*factor);
 if(a.group==='เกษตร')farmTrade+=a.cost*.042*factor;
 if(a.group==='เหมือง'){farmTrade+=a.cost*.056*factor;mines.push(e.p)}
 if(a.group==='ค้าขาย'){shopTrade+=a.cost*.042*factor;shopSlots+=(SHOP_WEIGHT[e.id]||1)*factor}
 if(a.group==='ชุมชน'){service[e.id]+=factor;if(e.id==='park')parks.push(e.p)}
 }
 // Parks within three tiles soften a mine's pollution; a running coal plant also pollutes.
 for(const m of mines)dirty+=parks.some(p=>distance(p,m)<=3)?1:2;
 dirty+=live.filter(e=>e.id==='plant').length;
 const people=Math.max(40,s.pop),cover=id=>Math.min(1,service[id]*COMMUNITY[id]/people);
 const park=cover('park'),edu=cover('school'),health=cover('clinic'),faith=cover('temple');
 // Shops need customers: trade grows with residents per shop.
 const demand=shopSlots?Math.min(1.25,.4+s.pop/Math.max(40,shopSlots*35)):0;
 const trade=Math.round(farmTrade+shopTrade*demand),debtPay=Math.min(s.debt||0,DEBT_PAYMENT);
 const coverage=used?Math.round(100*served/used):0, income=Math.round(s.pop*s.tax*.43*(1+.15*edu)+trade),expense=Math.round(upkeep+s.services*(60+s.pop*.3)+debtPay);
 const jobFill=Math.min(1,jobs/Math.max(1,s.pop*.65)),care=2.5*(park+edu+health+faith);
 const target=clamp(35+coverage*.18+jobFill*13+care+s.services*4-(s.tax-8)*2-dirty-(s.cash<0?14:0),8,96);
 return {roads,live,powered,access,capacity:Math.floor(capacity),jobs,coverage,income,expense,target,trade,demand,park,edu,health,faith,jobFill,debtPay,dirty};
}
function average(list,fallback){return list?.length?list.reduce((a,b)=>a+b,0)/list.length:fallback}
// Advances one month. Returns an election result object in election months, otherwise null.
function advance(s){
 const a=analyze(s);s.month++;s.party+=s.opposition?180:100;s.cash+=a.income-a.expense;s.debt=Math.max(0,(s.debt||0)-a.debtPay);
 // Residents arrive when there are homes, work and a council they like; clinics speed growth.

 const g=surface.getContext('2d'),pixels=g.createImageData(size,size);

  const j=y/step-12.5;
  for(let x=0;x<size;x++){
   const i=x/step-12.5,river=3.3+Math.sin(i*.28)*1.45+i*.12;
   const bank=Math.abs(j-river),edge=Math.min(1,Math.max(0,(bank-.94)/.25));

   const ripple=3.5*Math.sin(i*38+j*23+2*Math.sin(j*4));

   pixels.data[a+2]=(122+17*deep+ripple)*(1-edge)+(89+meadow+35*sand)*edge;

 if(which==='politics')$('detail').innerHTML='<h2 id="modalTitle">สนามเลือกตั้ง</h2><p id="pRole"></p><div class="facts"><div>เลือกตั้งใน<b id="pNext"></b></div><div>เงินพรรค<b id="pParty"></b></div><div>ความเชื่อมั่นสะสม<b id="pTrust"></b></div><div>คะแนนรอบนี้<b id="pBonus"></b></div><div id="pBaseLabel">คะแนนนิยมเฉลี่ย 6 เดือน<b id="pBase"></b></div></div><p>ลงพื้นที่ได้เดือนละครั้ง ใช้เงินพรรคแยกจากคลังเทศบาล</p><div class="act"><button class="primary" id="good">เวทีรับฟัง · ฿180</button><button class="primary" id="bad">ซื้อเสียง · ฿900</button></div><p><small id="pRisk"></small></p><p>เสียงถึง 50% ชนะเลือกตั้ง ชนะสองสมัยเลื่อนระดับ ผลงานเทศบาลช่วยฝ่ายบริหาร เมื่อแพ้ คู่แข่งจะบริหารเมืองแทน และความนิยมของคู่แข่งจะค่อย ๆ ลดลง</p><small>เส้นทางสมมติในเกม · ตำบล › อำเภอ › จังหวัด › สส. › นายกรัฐมนตรี</small>';
 else $('detail').innerHTML='<h2 id="modalTitle">สภาเมือง</h2><p>งบประมาณต่อเดือน</p><div class="facts"><div>รายรับ<b id="fIncome"></b></div><div>รายจ่าย<b id="fExpense"></b></div><div>มีไฟฟ้าใช้<b id="fPower"></b></div><div>ตำแหน่งงาน<b id="fJobs"></b></div><div>ความต้องการค้าขาย<b id="fDemand"></b></div><div>บริการชุมชน<b id="fCare"></b></div></div><div class="ui-row council-row first"><span><label class="ui-lab" for="tax">ภาษี</label><span class="ui-sub">ภาษีสูงได้รายรับมาก แต่ความนิยมลดลง</span></span><span class="ui-val"><span id="taxVal"></span>%</span><div class="ui-range-wrap"><input id="tax" class="ui-range" type="range" min="2" max="22"></div></div><div class="ui-row council-row"><span><label class="ui-lab" for="svc">งบบริการ</label><span class="ui-sub">บริการดีขึ้นช่วยความนิยม แต่รายจ่ายเพิ่ม</span></span><span class="ui-val"><span id="svcVal"></span>/5</span><div class="ui-range-wrap"><input id="svc" class="ui-range" type="range" min="0" max="5"></div></div><div class="act"><button class="primary" id="loan">กู้ฉุกเฉิน +฿'+fmt(LOAN)+'</button><button class="danger" id="reset">เริ่มเมืองใหม่</button></div><p><small id="fDebt"></small></p><p><small>ถนนทุกสายต้องต่อถึงซุ้มประตูเมืองด้านตะวันตก วางถนนบนลำน้ำเพื่อสร้างสะพานข้ามไปฝั่งเหนือ เหมืองถ่านหินและโรงไฟฟ้าต้องติดถนน เสาไฟเชื่อมกันเมื่อเสาต้นใดต้นหนึ่งเอื้อมถึง ภาษีสูงทำให้ความนิยมลดลง โรงเรียน อนามัย วัด และสวน ดูแลคนได้จำนวนจำกัด เมืองโตต้องสร้างเพิ่ม</small></p><p><small>ลากแผนที่เพื่อเลื่อน • ใช้ปุ่ม + / − หรือสองนิ้วเพื่อซูม • แตะอาคารเพื่อดูบริการ • บันทึกอัตโนมัติในเบราว์เซอร์</small></p>';
 if(which==='politics'){for(let [id,kind] of [['good','good'],['bad','buy']])$(id).onclick=()=>{const before=s.party,msg=politics(s,kind);tell(msg);if(s.party<before)emit('politics',{kind});else emit('invalid',{reason:msg});refresh()}}
 else{
  // Sliders update the budget in place while dragging, without rebuilding the dialog.
  for(let [id,prop] of [['tax','tax'],['svc','services']])$(id).oninput=e=>{if(s.opposition)return;s[prop]=Number(e.target.value);paintRange(e.target);stats=analyze(s);updateModal();save()};
  $('loan').onclick=()=>{const why=takeLoan(s);if(why)return reject(why);tell(s.news);emit('politics',{kind:'loan',amount:LOAN});refresh()};
  $('reset').onclick=()=>{
   if(!resetArmed||performance.now()-resetArmed>4000){resetArmed=performance.now();$('reset').textContent='แตะอีกครั้งเพื่อยืนยัน';const armedAt=resetArmed;setTimeout(()=>{if(resetArmed===armedAt){resetArmed=0;if($('reset'))$('reset').textContent='เริ่มเมืองใหม่'}},4000);return}
   resetArmed=0;pause();city=newCity();cars=[];anims=[];particles=[];inspect=null;scene?.invalidate();$('modal').close();selectTool(null);refresh();setSpeed(0);tell('เริ่มเมืองใหม่แล้ว');emit('politics',{kind:'reset'});
  };
 }
 updateModal();
 if(!$('modal').open){$('modal').showModal();emit('modal-open',{id:'modal',tab:which})}
}
// Slider fill uses the --v custom property, as in the settings dialog.
function paintRange(el){const lo=+el.min,hi=+el.max;el.style.setProperty('--v',(hi>lo?(+el.value-lo)/(hi-lo)*100:0)+'%')}
function updateModal(){
 const s=city,a=stats,set=(id,v)=>{const el=$(id);if(el&&el.textContent!==String(v))el.textContent=v};
 if(tab==='politics'){
  if(!$('pRole'))return;
  set('pRole',roles[s.level]+' · '+(s.opposition?'ฝ่ายค้าน':'ฝ่ายบริหาร'));set('pNext',(12-s.month%12)+' เดือน');set('pParty','฿ '+fmt(s.party));set('pTrust',s.trust);set('pBonus','+'+(s.campaign+s.influence));
  $('pBaseLabel').firstChild.textContent=s.opposition?'ความนิยมคู่แข่ง':'คะแนนนิยมเฉลี่ย 6 เดือน';set('pBase',Math.round(s.opposition?s.rival:average(s.hist,s.approval))+'%');
  set('pRisk','เวทีชุมชนให้ +2 คะแนนและความเชื่อมั่นข้ามปี ซื้อเสียงให้ +6 เฉพาะรอบนี้ และเสี่ยงถูกตัดสิทธิ์ ปัจจุบันเสี่ยง '+Math.min(85,Math.round(s.influence*5))+'%');
  for(const id of ['good','bad'])$(id).disabled=s.actionMonth===s.month;
  return;
 }
 if(!$('fIncome'))return;
 set('fIncome','฿ '+fmt(a.income));set('fExpense','฿ '+fmt(a.expense));set('fPower',a.coverage+'%');set('fJobs',a.jobs);
 set('fDemand',a.demand?Math.round(a.demand*100)+'%':'—');set('fCare',Math.round(25*(a.park+a.edu+a.health+a.faith))+'%');
 set('taxVal',s.tax);set('svcVal',s.services);
 for(const [id,prop] of [['tax','tax'],['svc','services']]){const el=$(id);el.disabled=s.opposition;if(document.activeElement!==el&&+el.value!==s[prop])el.value=s[prop];paintRange(el)}
 $('loan').disabled=s.opposition||s.cash>=0||s.month-s.loanMonth<12;
 set('fDebt',(s.debt>0?'หนี้คงค้าง ฿'+fmt(s.debt)+' · ผ่อนเดือนละ ฿'+fmt(Math.min(s.debt,DEBT_PAYMENT))+' • ':'')+'กู้ฉุกเฉินได้ปีละครั้งเมื่อเงินคลังติดลบ ความนิยม −6');
}
$('gov').onclick=()=>show('budget');$('political').onclick=()=>{show('politics');emit('politics',{kind:'open'})};$('dismiss').onclick=()=>$('modal').close();
$('play').onclick=()=>timer?pause():play();$('next').onclick=tick;$('speed').onclick=()=>setSpeed((city.speed||0)+1);
$('minus').onclick=()=>zoom(1/1.25);$('plus').onclick=()=>zoom(1.25);$('home').onclick=()=>center(true);

document.addEventListener('click',e=>{const b=e.target.closest?.('button');if(b&&!b.disabled)emit('ui-click',{id:b.id||null})},true);

// ---- Frame loop ----
let viewW=0,viewH=0;
function resize(){
 let d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);
 // Keep the player's camera; only the very first layout centres the town.
 if(!viewW)center(false);else{ox+=(innerWidth-viewW)*.55;oy+=(innerHeight-viewH)*.5;render()}
 viewW=innerWidth;viewH=innerHeight;
}
let lastFrame=0,lastDraw=0,frameFailed=false;
function frame(now){
 rafId=0;
 const dt=lastFrame?Math.min(.1,(now-lastFrame)/1000):0;lastFrame=now;
 let active=stepCamera(now);active=stepFling(dt)||active;
 if(updateEnv(dt))active=true;
 if(!reduceMotion)env.ambient+=dt;
 updateTraffic(reduceMotion?0:dt);updateParticles(dt,now);
 if(anims.length){pruneAnims(now);active=true}
 if(particles.length||floaters.length||flashes.length||birds.length||inspect||(hover&&selected))active=true;
 // idle: redraw cadence with nothing happening; budget: minimum gap between any two draws.
 const idle=!reduceMotion?(!scene?66:lowPower?33:0):(timer?250:Infinity),budget=lowPower?33:!scene?16:0;
 if((dirty||active||now-lastDraw>=idle)&&now-lastDraw>=budget){
  lastDraw=now;dirty=false;
  try{updateParcels();if(scene)scene.draw(now);else render2D(now);drawFx(now)}
  catch(err){console.error('Render failed',err);if(scene)fallback();else if(!frameFailed)frameFailed=true}
 }
 // Sleep when fully idle; render() wakes the loop again.
 if(dirty||active||idle!==Infinity)wake();
}
let scene=null;
try{scene=createScene($('world3d'))}catch(err){console.warn('3D renderer unavailable',err)}
function fallback(){scene=null;$('world3d').hidden=true;canvas.style.opacity='1';render()}
if(scene){canvas.style.opacity='0';$('world3d').addEventListener('webglcontextlost',e=>{e.preventDefault();fallback()})}else fallback();
motionQuery.addEventListener?.('change',syncMotion);new MutationObserver(syncMotion).observe(document.documentElement,{attributes:true,attributeFilter:['class']});syncMotion();
// Small hook for ui.js settings (all optional).
window.PYKGraphics={setDayNight(on){env.dayNight=!!on;render()},isDayNight:()=>env.dayNight,hour:()=>env.hour,reducedMotion:()=>reduceMotion};
addEventListener('resize',resize);$('speed').textContent=SPEED_LABELS[city.speed||0];list();fold(innerWidth<720);resize();refresh();
loadPhotos();wake();
